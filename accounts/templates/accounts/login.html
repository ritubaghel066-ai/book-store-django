<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Book Store</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'store/style.css' %}">
</head>

<body>

    <nav>
        <div>
            <h2>Book Store</h2>
        </div>

        <div>
            <a href="/">Home</a>
            <a href="/books/">Books</a>
            <a href="/cart/">Cart</a>
            <a href="/#categories">Categories</a>
            <a href="/about/">About</a>
            <a href="/contact/">Contact</a>
        </div>
    </nav>


    <section class="featured-books">

        <h2>Login</h2>

        <p class="section-subtitle">
            Login to your Book Store account.
        </p>

        <form method="POST">
            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <p>
            Don't have an account?
            <a href="/accounts/register/">Register here</a>
        </p>

    </section>

</body>
</html>
